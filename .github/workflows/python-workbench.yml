name: Python workflow workbench

on:
  push:
    paths: ['skill_workflow/**', 'tests/**', 'examples/**', 'pyproject.toml', '.github/workflows/python-workbench.yml']
  pull_request:
    paths: ['skill_workflow/**', 'tests/**', 'examples/**', 'pyproject.toml', '.github/workflows/python-workbench.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: Install Tk and virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Python tests with real Tk
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Python tests with real Tk
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
